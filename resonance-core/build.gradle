plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    implementation 'com.google.guava:guava:33.1.0-jre'
    implementation 'at.yawk.lz4:lz4-java:1.10.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'



    if (project.hasProperty("withNative")) {
        implementation project(':resonance-native')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 22
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
    maxParallelForks = 1
    forkEvery = 0
    testLogging {
        events = []
        showStandardStreams = false
        exceptionFormat = 'short'
    }

    def kernel  = (project.findProperty('kernel') ?: 'java').toString().toLowerCase()
    def preset  = (project.findProperty('preset') ?: 'ide').toString().toLowerCase()
    systemProperty 'resonance.kernel.native', (kernel == 'native') ? 'true' : 'false'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'bench.warmupIters', '10'
    systemProperty 'resonance.pattern.len', '1536'

    // Forward bench.*, resonance.index.*, resonance.insert.* to test JVM
    // Source 1: System properties (-D flags, may not reach Gradle daemon)
    System.getProperties().each { key, value ->
        def k = key.toString()
        if (k.startsWith('bench.') || k.startsWith('resonance.index.') || k.startsWith('resonance.insert.')) {
            systemProperty k, value.toString()
        }
    }
    // Source 2: Project properties (-P flags, always available)
    project.properties.each { key, value ->
        def k = key.toString()
        if (k.startsWith('bench.') || k.startsWith('resonance.index.') || k.startsWith('resonance.insert.')) {
            systemProperty k, value.toString()
        }
    }

    def baseArgs = [
            '--enable-preview',
            '--enable-native-access=ALL-UNNAMED',
            '--add-modules', 'jdk.incubator.vector',
            '-XX:ActiveProcessorCount=12',
            '-XX:+PerfDisableSharedMem',
            '-XX:+DisableAttachMechanism',
            '-XX:+AlwaysPreTouch'
    ]

    def heapArgs
    if (preset == 'heavy') {
        heapArgs = [
                '-Xms2g', '-Xmx4g',
                '-XX:+UseZGC',
                '-XX:+ZGenerational'
        ]
    } else if (preset == 'mid') {
        heapArgs = [
                '-Xms1g', '-Xmx2g',
                '-XX:+UseG1GC',
                '-XX:G1HeapRegionSize=16m',
                '-XX:MaxGCPauseMillis=200'
        ]
    } else {
        heapArgs = [
                '-Xms512m', '-Xmx512m',
                '-XX:+UseG1GC',
                '-XX:G1HeapRegionSize=8m',
                '-XX:MaxGCPauseMillis=100'
        ]
    }

    enableAssertions = false
    jvmArgs = baseArgs + heapArgs

    doFirst {
        println ">>> Test JVM args: ${jvmArgs}"
        println ">>> resonance.kernel.native=${(kernel == 'native')}"
        println ">>> preset=${preset}"
    }
}

tasks.register('testJavaPerf', Test) {
    description = "Run performance tests with JavaKernel (preset=ide)"
    group = "verification"

    useJUnitPlatform {
        includeTags 'benchmark'
    }
    maxParallelForks = 1
    forkEvery = 0

    systemProperty 'resonance.pattern.len', '1536'
    systemProperty 'resonance.kernel.native', 'false'
    systemProperty 'file.encoding', 'UTF-8'

    jvmArgs = [
            '--enable-preview',
            '--enable-native-access=ALL-UNNAMED',
            '--add-modules', 'jdk.incubator.vector',
            '-Xms512m', '-Xmx512m',
            '-XX:+UseG1GC',
            '-XX:G1HeapRegionSize=8m',
            '-XX:MaxGCPauseMillis=100'
    ]

    testLogging.showStandardStreams = true
}

